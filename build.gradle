plugins {
    id 'fabric-loom' version '1.11.8'
}
version = '0.1.0+mc1.21.1'
group = 'nl.smartstreamlabs.sbwdroneconfig'
base { archivesName = 'sbw-drone-warfare-fabric' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.parchmentmc.org' }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex 'software\\.bernie.*' }
    }
    // Runtime-only for the headless game tests: Superb Warfare's own dependencies.
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'; content { includeGroup 'fuzs.forgeconfigapiport' } }
    maven { url = 'https://maven.wispforest.io'; content { includeGroupByRegex 'io\\.wispforest.*' } }
    maven { url = 'https://mvn.devos.one/snapshots/' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://jitpack.io'; content { includeGroupByRegex 'com\\.github\\..*' } }
    ivy {
        url = 'https://github.com/netherg-io/simplebedrockmodel-fabric/releases/download'
        patternLayout { artifact '[revision]/[artifact].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'netherg-io-sbm' }
    }
    ivy {
        url = 'https://github.com/netherg-io/superbwarfare-fabric/releases/download'
        patternLayout { artifact '[revision]/[artifact].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'netherg-io' }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.layered {
        officialMojangMappings()
        parchment 'org.parchmentmc.data:parchment-1.21.1:2024.11.17@zip'
    }
    modImplementation 'net.fabricmc:fabric-loader:0.19.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.15+1.21.1'
    modImplementation 'netherg-io:superbwarfare-0.8.9.1-mc1.21.1-bf19:bf19'
    modImplementation 'software.bernie.geckolib:geckolib-fabric-1.21.1:4.7.5'
    modImplementation 'net.fabricmc:fabric-language-kotlin:1.13.7+kotlin.2.2.21'
    // Dev runtime only (runGametest/runServer): SBW's own dependencies; nothing here is bundled.
    modRuntimeOnly 'fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.6'
    modRuntimeOnly 'io.wispforest:accessories-fabric:1.1.0-beta.53+1.21.1'
    modRuntimeOnly 'netherg-io-sbm:simplebedrockmodel-fabric-2.5.1+mc1.21.1-bf4:bf4'
    modRuntimeOnly 'com.maydaymemory:mae:1.1.4'
    for (module in ['core', 'entity', 'level_events', 'client_events', 'transfer', 'items']) {
        modRuntimeOnly "io.github.fabricators_of_create.Porting-Lib:$module:3.1.0-beta.90+1.21.1"
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
test { useJUnitPlatform() }
// Unported Forge sources and unaudited assets stay outside the distributed artifact.
sourceSets.main {
    java.setSrcDirs(['src/fabric/java'])
    resources.setSrcDirs(['src/fabric/resources'])
}
sourceSets.test.java.setSrcDirs(['src/fabricTest/java'])
// In-engine tests on a headless dedicated server: ./gradlew runGametest (report in build/gametest/junit.xml).
sourceSets {
    gametest {
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}
loom {
    mods {
        sbwdroneconfig { sourceSet sourceSets.main }
        sbwdroneconfig_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Game Test'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
            runDir 'build/gametest'
        }
    }
}
tasks.matching { it.name == 'runGametest' }.configureEach {
    doFirst {
        def dir = file('build/gametest')
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('LICENSE', 'NOTICE', 'CREDITS.md') }
