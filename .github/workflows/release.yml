# Tag bfN on fabric-1.21.1 (pushed, or created by a manual run with input `tag` on the branch head):
# build, then a GitHub Release with the jar `<name>-bfN.jar`, its sources
# jar and SHA256SUMS. Every jar deployed to Blockfield comes from such a release (AGPL-3.0 §13 source
# offer: the tag is the corresponding source). Blockfield pins it with
# `scripts/bump-fork.sh sbwdrone bfN` in blockfield-modpack.
name: Release
on:
  push:
    tags: ['bf[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'New tag bfN, created on the commit this run builds'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag=${INPUT_TAG:-$GITHUB_REF_NAME}
          printf '%s' "$tag" | grep -Eq '^bf[0-9]+$' || { echo "tag must be bfN, got '$tag'"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/fabric-1.21.1 ]; then
            echo "manual releases are cut from fabric-1.21.1 only"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build
      - run: python3 scripts/check-artifact.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd build/libs
          jar=$(ls *.jar | grep -v -e '-sources\.jar$')
          [ "$(printf '%s\n' "$jar" | wc -l)" -eq 1 ] || { echo "expected one jar, got: $jar"; exit 1; }
          base=${jar%.jar}
          mv "$jar" "$base-$TAG.jar"
          mv "$base-sources.jar" "$base-$TAG-sources.jar"
          sha256sum *.jar > SHA256SUMS
          cat SHA256SUMS
          notes="Corresponding source (AGPL-3.0-only): https://github.com/$GITHUB_REPOSITORY/tree/$TAG, commit $GITHUB_SHA. Build from a clean checkout with \`./gradlew build\` (Java 21, see README); the sources jar is attached too. Third-party assets: CREDITS.md."
          # On a manual run the tag does not exist yet: --target creates it on the built commit.
          gh release create "$TAG" *.jar SHA256SUMS --target "$GITHUB_SHA" --title "$base-$TAG" --notes "$notes"
